apiVersion: 1

datasources:
  - name: Prometheus
    uid: velos-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: PostgreSQL velos
    uid: velos-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: velos_lecture
    editable: false
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: velos
      sslmode: disable
      postgresVersion: 1800
      maxOpenConns: 5
      maxIdleConns: 2

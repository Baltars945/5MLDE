name: compose

on:
  workflow_call:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validation du fichier compose
        run: docker compose config --quiet

      - name: Demarrage de la stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Verification des services
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors http://127.0.0.1:5001/health
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors http://127.0.0.1:4201/api/health
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors http://127.0.0.1:9090/-/healthy
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors http://127.0.0.1:3001/api/health

      - name: Journaux en cas d'echec
        if: failure()
        run: docker compose ps && docker compose logs --no-color

      - name: Arret de la stack
        if: always()
        run: docker compose down -v

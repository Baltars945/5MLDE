name: security

on:
  workflow_call:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Export des dependances verrouillees
        run: uv export --locked --format requirements-txt --no-emit-project -o requirements-audit.txt

      - name: Audit des vulnerabilites
        run: uvx pip-audit --disable-pip -r requirements-audit.txt

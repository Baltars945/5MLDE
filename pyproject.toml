[project]
name = "velos"
version = "0.1.0"
description = "Chaine MLOps de prevision des locations de velos"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "mlflow>=3.16",
    "prefect>=3.9,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.21",
    "requests>=2.32",
    "great-expectations==1.23.2",
    "psycopg-pool>=3.3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "locust>=2.32",
    "ruff>=0.8",
    "psutil>=7.2.2",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
